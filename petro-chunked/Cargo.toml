[package]
name = "petro-chunked"
version = "0.1.0"
edition = "2024"

[features]
default = ["derive"]
derive = ["dep:petro-chunked-derive"]
glam = ["dep:glam"]

[dependencies]
anyhow = "1.0.104"
glam = {version = "0.33.12", optional = true}
byteorder = "1.5.0"
petro-chunked-derive = { version = "0.1.0", path = "../petro-chunked-derive", optional = true }
thiserror = "2.0.21"

[dev-dependencies]
clap = { version = "4.6.8", features = ["derive"] }
tracing-subscriber = "0.3.23"
