[package]
name = "baw"
version = "0.1.0"
edition = "2024"

[features]
default = ["physics-debug"]
physics-debug = ["avian3d/debug-plugin"]

[dependencies]
anyhow = "1.0.104"
bevy_panorbit_camera = "0.36.0"
clap = { version = "4.6.8", features = ["derive"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

baw-game-object = { version = "0.1.0", path = "../baw-game-object" }
bevy-alo = { version = "0.1.0", path = "../bevy-alo" }

[dependencies.avian3d]
version = "0.8.0"
default-features = false
features = ["3d", "collider-from-mesh", "parry-f32", "parallel", "bevy_scene", "bevy_picking"]

[dependencies.bevy]
version = "0.20.1"
features = ["debug", "dds"]
