[package]
name = "bevy-alo"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "^2.11.1"
bytemuck = { version = "^1.25.0", features = ["extern_crate_alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "^2.0.18"

baw-scene-util = { version = "0.1.0", path = "../baw-scene-util" }
petro-alo = { version = "0.1.0", path = "../petro-alo" }

[dependencies.bevy]
version = "0.19.1"
default-features = false
features = [
    "bevy_camera",
    "bevy_color",
    "bevy_log",
    "bevy_material",
    "bevy_mesh",
    "bevy_scene",
    "bevy_pbr",
]
