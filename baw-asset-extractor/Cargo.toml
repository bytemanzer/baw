[package]
name = "baw-asset-extractor"
version = "0.1.0"
edition = "2024"

[dependencies]
# TODO: switch back to a released version
ain = { git = "https://github.com/zstewar1/ain.git", branch = "dev" }
anyhow = "1.0.102"
bevy_asset = "0.19.1"
bevy_reflect = "0.19.1"
easy-parallel = "3.3.1"
encoding_rs = "0.8.42"
quick-xml = { version = "^0.42.0", features = ["serialize", "encoding", "overlapped-lists"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
smol = "2.0.2"
thiserror = "2.0.18"
tracing = "0.1.44"
walkdir = "2.5.0"

baw-config = { version = "0.1.0", path = "../baw-config" }
bevy-alo = { version = "0.1.0", path = "../bevy-alo" }
petro-alo = { version = "0.1.0", path = "../petro-alo" }

[dependencies.petro-meg]
version = "1.1.0"
default-features = false
features = ["v1", "reader"]
# TODO: switch back to a released version
git = "https://github.com/zstewar1/petro-meg.git"
branch = "improved-path"
