[package]
name = "baw-asset-extractor"
version = "0.1.0"
edition = "2024"

[dependencies]
ain = "0.2.1"
anyhow = "1.0.104"
bevy_asset = "0.20.1"
bevy_reflect = "0.20.1"
easy-parallel = "3.3.1"
encoding_rs = "0.8.44"
quick-xml = { version = "^0.42.0", features = ["serialize", "encoding", "overlapped-lists"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
smol = "2.0.2"
thiserror = "2.0.21"
tracing = "0.1.44"
walkdir = "2.5.0"

baw-game-object = { version = "0.1.0", path = "../baw-game-object" }
bevy-alo = { version = "0.1.0", path = "../bevy-alo" }
petro-alo = { version = "0.1.0", path = "../petro-alo" }
heck = "0.5.0"

[dependencies.petro-meg]
version = "1.1.1"
default-features = false
features = ["v1", "reader"]
